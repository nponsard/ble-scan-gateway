[package]
name = "ble-scan-reporter-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
ariel-os = { path = "build/imports/ariel-os/src/ariel-os", features = [
  "tcp",
  "mdns",
  "dns",
  "time",
] }
ariel-os-boards = { path = "build/imports/ariel-os/src/ariel-os-boards" }
embassy-futures = { version = "0.1.1" }
heapless = "0.8"
reqwless = { version = "0.13.0", default-features = true, features = [
  "embedded-tls",
] }
rand_core = "0.6.4"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
embassy-nrf = { version = "0.3.0", features = ["nrf5340-app-s"] }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(context, values(any()))',
] }
